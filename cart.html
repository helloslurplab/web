<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart — Slurp Laboratories</title>
<link rel="icon" href="cdn/shop/files/Logo_3000_x_3000_32x32.png">
<style>
  @font-face{font-family:"Helvetica Now Text";src:url("cdn/shop/files/HelveticaNowText-Regular.woff2") format("woff2");font-display:swap}
  @font-face{font-family:"Helvetica Now Text";src:url("cdn/shop/files/HelveticaNowText-Light.woff2") format("woff2");font-weight:300;font-display:swap}

  :root{--ink:#3e4347;--page:#f7f7f7;--muted:#666c70}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--page);color:var(--ink);font:15px "Helvetica Now Text",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{color:inherit;font:inherit}
  :focus-visible{outline:2px solid currentColor;outline-offset:4px}

  .site-header{position:relative;display:grid;grid-template-columns:18% minmax(0,1fr) 35%;align-items:center;padding:14px 4vw;min-height:68px}
  .brand{justify-self:start}
  .brand img{display:block;width:74px;height:auto}
  .primary-nav,.header-tools{display:flex;align-items:center}
  .primary-nav{justify-content:space-between;gap:18px}
  .header-tools{justify-content:flex-end;gap:clamp(22px,5vw,84px);padding-right:1.4vw}
  .primary-nav a:hover,.cart-link:hover,.locale-menu a:hover{text-decoration:underline;text-underline-offset:4px}
  .locale{position:relative}
  .locale summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer}
  .locale summary::-webkit-details-marker{display:none}
  .locale summary::after,.newsletter-link::after{content:"";width:7px;height:7px;border-right:1px solid;border-bottom:1px solid;transform:rotate(45deg)}
  .locale[open] summary::after{transform:rotate(225deg)}
  .language summary span{text-decoration:underline;text-underline-offset:4px}
  .locale-menu{position:absolute;z-index:2;top:calc(100% + 12px);right:0;min-width:130px;padding:8px 14px;display:grid;gap:8px;border:1px solid #d0d2d3;background:var(--page);white-space:nowrap}
  .menu-toggle{display:none}

  main{flex:1;display:grid;place-items:center;padding:40px 24px 82px;text-align:center}
  .empty-cart{display:grid;justify-items:center;gap:23px}
  h1{margin:0;font-size:clamp(32px,3vw,48px);font-weight:400;line-height:1.12;letter-spacing:-.035em}
  .continue{display:inline-flex;align-items:center;justify-content:center;min-height:60px;min-width:288px;max-width:100%;padding:12px 28px;border:2px solid var(--ink);border-radius:999px;font-size:21px;line-height:1.2;letter-spacing:-.025em}
  .continue:hover{background:var(--ink);color:var(--page)}

  .site-footer{display:flex;justify-content:flex-end;align-items:center;gap:clamp(22px,4.1vw,66px);padding:26px 12vw 42px;color:var(--muted);font-weight:300}
  .newsletter{display:flex;align-items:center;gap:30px}
  .newsletter-link{display:flex;justify-content:space-between;align-items:center;gap:16px;width:clamp(130px,15.5vw,246px);min-height:36px;border-bottom:1px solid currentColor}
  .newsletter-link::after{transform:rotate(-45deg)}
  .socials{display:flex;align-items:center;gap:clamp(12px,1.6vw,26px)}
  .socials a{display:grid;place-items:center;min-width:24px;min-height:36px}
  .socials svg{display:block;width:22px;height:22px;fill:currentColor}
  .site-footer small{font-size:inherit;white-space:nowrap}

  @media (min-width:901px) and (max-width:1150px){
    .site-footer{padding-inline:4vw}
    .header-tools{gap:24px}
  }

  @media (max-width:900px){
    .site-header{grid-template-columns:auto 1fr auto;gap:20px;min-height:64px;padding:8px 20px}
    .brand{grid-column:2;grid-row:1;justify-self:center}
    .brand img{width:66px}
    .menu-toggle{display:block;grid-column:1;grid-row:1;margin-left:-6px;padding:0 6px;min-height:44px;border:0;background:none;cursor:pointer}
    .header-tools{grid-column:3;grid-row:1;padding:0}
    .header-tools .locale{display:none}
    .cart-link{display:flex;align-items:center;min-height:44px}
    .primary-nav{display:none;position:absolute;z-index:1;top:100%;inset-inline:0;align-items:stretch;padding:8px 20px 16px;border-bottom:1px solid #d0d2d3;background:var(--page)}
    .site-header.menu-open .primary-nav{display:grid;gap:0}
    .primary-nav a{display:flex;align-items:center;min-height:44px}
    main{padding:40px 20px 56px}
    .empty-cart{gap:19px}
    .continue{min-height:52px;min-width:min(242px,100%);font-size:17px}
    .site-footer{flex-direction:column;gap:12px;padding:16px 20px 24px;text-align:center}
    .newsletter{width:min(100%,330px);gap:10px;flex-direction:column}
    .newsletter-link{width:100%;text-align:left;min-height:44px}
    .socials{gap:8px}
    .socials a{min-width:44px;min-height:44px}
  }
</style>
</head>

<header class="site-header">
  <a class="brand" href="index.html"><img src="cdn/shop/files/slurp-logo_150x.svg" alt="Slurp Laboratories"></a>

    <details class="locale">
      <summary aria-label="Currency, USD">USD</summary>
      <div class="locale-menu">
        <a href="collections/all.html">USD · United States</a>
        <a href="https://slurplaboratories.com/en-gb/collections/all">GBP · United Kingdom</a>
        <a href="https://slurplaboratories.com/en-sg/collections/all">SGD · Singapore</a>
      </div>
    </details>
    <a class="cart-link" href="cart.html" aria-current="page">Cart</a>
    <details class="locale language">
      <summary aria-label="Language, English"><span>EN</span></summary>
      <div class="locale-menu">
        <a href="collections/all.html">English</a>
        <a href="https://slurplaboratories.com/ko/collections/all" lang="ko">한국어</a>
        <a href="https://slurplaboratories.com/zh/collections/all" lang="zh-Hans">简体中文</a>
      </div>
    </details>
  </div>
</header>

<script>
  const menuButton = document.querySelector('.menu-toggle');
  const header = document.querySelector('.site-header');

  function toggleMenu(open) {
    header.classList.toggle('menu-open', open);
    menuButton.setAttribute('aria-expanded', String(open));
  }

  menuButton.addEventListener('click', () => toggleMenu(!header.classList.contains('menu-open')));
  header.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && header.classList.contains('menu-open')) {
      toggleMenu(false);
      menuButton.focus();
    }
  });
</script>
